[program:mypage-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/mypage.ng/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=90 --backoff=10
directory=/var/www/mypage.ng
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/mypage.ng/storage/logs/queue-worker.log
stopwaitsecs=3600
